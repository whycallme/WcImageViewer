<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>WC Image Viewer — concept B / hover</title>
<link rel="stylesheet" href="mockup.css">
</head>
<body class="c-b s-hover">
  <div class="app c-b">

  <header class="bar">
    <div class="row">
      <div class="brand"><svg class="appmark" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.4" width="13" height="11.2" rx="2"/><circle cx="5.6" cy="6.2" r="1.05"/><path d="M2.4 11.7l3.2-3 2.4 2.1 2.2-2.4 3.4 3.3"/></svg><span class="appname">WC Image Viewer</span></div>
      <span class="sep"></span>
      <button class="iconbtn" data-control="파일 열기" title="파일 열기 (Ctrl+O)"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.3 2.3h4.3l3.1 3.1v8.3H4.3z"/><path d="M8.6 2.3v3.1h3.1"/><path d="M6 11.2l1.6-1.8 1.2 1.2 1.3-1.5"/></svg></button>
      <button class="iconbtn" data-control="폴더 열기" title="폴더 열기"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 4.3h4.1l1.4 1.5h6.1v7.5H2.2z"/></svg></button>
      <span class="sep"></span>
      <button class="iconbtn" data-control="이전" title="이전 (←)"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
      <button class="iconbtn" data-control="다음" title="다음 (→)"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
      <span class="tool hot"><button class="iconbtn hot" data-control="맞춤" title="창에 맞춤 (0)"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.2 9.8L2.5 13.5M2.5 10.7v2.8h2.8M9.8 6.2l3.7-3.7M10.7 2.5h2.8v2.8M6.2 6.2L2.5 2.5M5.3 2.5H2.5v2.8M9.8 9.8l3.7 3.7M13.5 10.7v2.8h-2.8"/></svg></button><span class="tip">창에 맞춤 <kbd>0</kbd></span></span>
      <button class="iconbtn" data-control="100%" title="실제 크기 (1)"><span style="font-size:9.5px;font-weight:600;letter-spacing:-.02em">1:1</span></button>
      <div class="zoom" data-control="배율 입력" title="표시 배율">100%</div>
      <button class="iconbtn" data-control="창 맞춤" title="이미지 크기에 창 맞춤 (W)"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="8.6" rx="1"/><rect x="5.1" y="5.4" width="5.8" height="3.8" rx=".4"/><path d="M5.6 13.5h4.8"/></svg></button>
      <span class="sep"></span>
      <button class="iconbtn" data-control="슬라이드" title="슬라이드쇼 (S)"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.4 3.4l7 4.6-7 4.6z" fill="currentColor" stroke-linejoin="round"/></svg></button>
      <button class="iconbtn" data-control="최근" title="최근 항목"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.9"/><path d="M8 4.7V8l2.3 1.4"/></svg></button>
      <button class="iconbtn" data-control="설정" title="설정"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.9v1.5M8 12.6v1.5M1.9 8h1.5M12.6 8h1.5M3.7 3.7l1.1 1.1M11.2 11.2l1.1 1.1M12.3 3.7l-1.1 1.1M4.8 11.2l-1.1 1.1"/></svg></button>
      <div class="window-controls"><button class="wbtn" data-control="최소화" aria-label="최소화"><svg class="ico" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M0 5h10"/></svg></button><button class="wbtn" data-control="최대화" aria-label="최대화"><svg class="ico" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9"/></svg></button><button class="wbtn close" data-control="닫기" aria-label="닫기"><svg class="ico" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button></div>
    </div>
  </header>

    <main class="stage">
      <div class="viewer">
        <img class="photo" src="assets/img0.jpg" alt="Windows bloom wallpaper">
        <div class="scrim-top"></div>
        <div class="info"><div class="name"><span class="dot"></span>img0.jpg</div><div class="meta">3840 × 2400 px&nbsp;&nbsp;·&nbsp;&nbsp;9.2 MP&nbsp;&nbsp;·&nbsp;&nbsp;100% (맞춤)</div></div>
        <div class="tabhint"><kbd>Tab</kbd> 정보</div>
        <div class="thumbs">
        <button class="thumb" tabindex="-1" aria-label="이미지 1"><img src="assets/img0.jpg" alt="" style="object-position:22% 30%;transform:scale(1)"></button>
        <button class="thumb" tabindex="-1" aria-label="이미지 2"><img src="assets/img0.jpg" alt="" style="object-position:72% 24%;transform:scale(1.25);filter:hue-rotate(-14deg) saturate(1.12)"></button>
        <button class="thumb" tabindex="-1" aria-label="이미지 3"><img src="assets/img0.jpg" alt="" style="object-position:46% 72%;transform:scale(1);filter:brightness(.88) contrast(1.08)"></button>
        <button class="thumb selected" tabindex="-1" aria-label="이미지 4"><img src="assets/img0.jpg" alt="" style="object-position:84% 62%;transform:scale(1);filter:hue-rotate(12deg)"></button>
        <button class="thumb" tabindex="-1" aria-label="이미지 5"><img src="assets/img0.jpg" alt="" style="object-position:30% 50%;transform:scale(1.45);filter:saturate(.7) brightness(1.12)"></button>
        <button class="thumb hot" tabindex="-1" aria-label="이미지 6"><img src="assets/img0.jpg" alt="" style="object-position:62% 80%;transform:scale(1.15);filter:hue-rotate(-24deg) brightness(.92)"></button>
        <button class="thumb" tabindex="-1" aria-label="이미지 7"><img src="assets/img0.jpg" alt="" style="object-position:14% 74%;transform:scale(1);filter:saturate(1.3) contrast(.95)"></button>
        <button class="thumb" tabindex="-1" aria-label="이미지 8"><img src="assets/img0.jpg" alt="" style="object-position:90% 34%;transform:scale(1.3);filter:hue-rotate(24deg) brightness(1.02)"></button>
        <span class="count"><b>4</b> / 8</span>
      </div>
      </div>
    </main>
  </div>

  <script>
  (function () {
    var el = function (s) { return document.querySelector(s); };
    var w = function (n) { return n ? Math.round(n.getBoundingClientRect().width * 10) / 10 : 0; };
    var h = function (n) { return n ? Math.round(n.getBoundingClientRect().height * 10) / 10 : 0; };
    var row = el('.row');
    var kids = row ? Array.prototype.slice.call(row.children) : [];
    var gap = row ? (parseFloat(getComputedStyle(row).columnGap) || 0) : 0;
    var intrinsic = row ? Math.round(kids.reduce(function (a, n, i) {
      var cs = getComputedStyle(n);
      var ml = parseFloat(cs.marginLeft) || 0;
      var mr = parseFloat(cs.marginRight) || 0;
      if (n.classList.contains('window-controls')) { ml = 0; }
      return a + n.getBoundingClientRect().width + ml + mr + (i ? gap : 0);
    }, 0)) : null;
    var controls = Array.prototype.map.call(document.querySelectorAll('[data-control]'), function (n) {
      var r = n.getBoundingClientRect();
      return { n: n.getAttribute('data-control'), w: Math.round(r.width), h: Math.round(r.height) };
    });
    var thumb = el('.thumb');
    var strip = el('.thumbs');
    var data = {
      concept: 'B',
      state: 'hover',
      viewport: [window.innerWidth, window.innerHeight],
      titlebar: h(el('.titlebar')),
      toolbar: h(el('.toolbar')),
      mergedBar: h(el('.bar')),
      chrome: h(el('.titlebar')) + h(el('.bar')) + h(el('.toolbar')),
      viewer: h(el('.viewer')),
      strip: h(strip),
      stripMode: strip ? (getComputedStyle(strip).position === 'absolute' ? 'overlay' : 'flow') : 'none',
      row: row ? {
        client: Math.round(row.clientWidth),
        scroll: Math.round(row.scrollWidth),
        intrinsic: intrinsic,
        slack: Math.round(row.clientWidth - intrinsic)
      } : null,
      rowOverflow: row ? row.scrollWidth > row.clientWidth + 1 : null,
      thumb: thumb ? [Math.round(thumb.getBoundingClientRect().width), Math.round(thumb.getBoundingClientRect().height)] : null,
      controls: controls
    };
    var s = document.createElement('script');
    s.type = 'application/json';
    s.id = 'measure';
    s.textContent = JSON.stringify(data);
    document.body.appendChild(s);
  })();
  </script>
</body>
</html>
